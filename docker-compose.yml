services:
  voice:
    container_name: voice-server
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data/cache:/root/.cache    # Whisper モデルキャッシュ
      - ./data/app:/app/data         # SQLite DB + 事前生成 WAV
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=change-me-in-production
      - VOSK_MODEL_PATH=/app/vosk-model-ja-0.22
      - DB_PATH=/app/data/commands.db
      - RESPONSES_DIR=/app/data/responses
      - VOICEVOX_URL=http://voicevox:50021
      - VOICEVOX_SPEAKER_ID=1
      # Home Assistant (network_mode: host のためホストIPで指定)
      - HA_URL=http://192.168.1.40:8123
      - HA_TOKEN=                        # HA の長期アクセストークンを設定
      # エンティティID (HA の実際の値に合わせて変更)
      - HA_LIGHT_ENTITY=light.living_room
      - HA_AC_ENTITY=climate.living_room
      - HA_PC_ENTITY=switch.pc
    depends_on:
      - voicevox
    restart: unless-stopped

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./hass_config:/config
    network_mode: host
    restart: unless-stopped

  voicevox:
    container_name: voicebox
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "50021:50021"
    restart: unless-stopped
