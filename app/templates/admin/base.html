<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>voice-server 管理画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: bold; }
    .wav-matrix td { vertical-align: middle; white-space: nowrap; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('admin.index') }}">🎙 voice-server 管理</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link {% if request.endpoint in ('admin.index','admin.command_new','admin.command_edit') %}active{% endif %}"
         href="{{ url_for('admin.index') }}">コマンド</a>
      <a class="nav-link {% if request.endpoint == 'admin.fallback_index' %}active{% endif %}"
         href="{{ url_for('admin.fallback_index') }}">フォールバック応答</a>
      <a class="nav-link {% if request.endpoint == 'admin.characters_index' %}active{% endif %}"
         href="{{ url_for('admin.characters_index') }}">キャラクター</a>
    </div>
    <form method="post" action="{{ url_for('admin.reload') }}" class="d-flex">
      <button class="btn btn-outline-warning btn-sm" type="submit"
              onclick="return confirm('VOSK の grammar をリロードしますか？')">
        🔄 VOSK に反映
      </button>
    </form>
  </div>
</nav>

<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
